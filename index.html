<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="クローゼット" />
    <meta name="description" content="クローゼットの品目と個数を、すばやく管理できるシンプルなアプリです。" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>クローゼット</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">MY INVENTORY</p>
          <h1>クローゼット</h1>
        </div>
        <div class="total" aria-live="polite">
          <span>合計</span>
          <strong id="total-count">0</strong>
          <small>点</small>
        </div>
      </header>

      <section class="add-panel" aria-labelledby="add-title">
        <h2 id="add-title">新しい品目</h2>
        <form id="item-form">
          <label for="item-name">品目名</label>
          <input id="item-name" name="name" type="text" placeholder="例：Tシャツ" maxlength="40" autocomplete="off" required />

          <div class="form-row">
            <div class="quantity-field">
              <label for="item-quantity">個数</label>
              <input id="item-quantity" name="quantity" type="number" value="1" min="1" max="9999" inputmode="numeric" required />
            </div>
            <button class="add-button" type="submit">追加</button>
          </div>
        </form>
      </section>

      <section class="inventory" aria-labelledby="inventory-title">
        <div class="section-heading">
          <h2 id="inventory-title">アイテム</h2>
          <span id="item-kinds">0種類</span>
        </div>
        <ul id="item-list" class="item-list"></ul>
        <div id="empty-state" class="empty-state">
          <div class="empty-icon" aria-hidden="true">＋</div>
          <p>まだ品目がありません</p>
          <span>上のフォームから追加してください</span>
        </div>
      </section>
    </main>

    <template id="item-template">
      <li class="item-card">
        <div class="item-info">
          <h3 class="item-name"></h3>
          <button class="delete-button" type="button" aria-label="削除">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5" /></svg>
          </button>
        </div>
        <div class="stepper">
          <button class="step-button decrease" type="button" aria-label="1つ減らす">−</button>
          <output class="item-count" aria-live="polite"></output>
          <button class="step-button increase" type="button" aria-label="1つ増やす">＋</button>
        </div>
      </li>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
